name: Taskora Full CI/CD

on:
  push:
    branches: [ main ]

jobs:
  backend:
    name: Backend (Django + Pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations check
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (pytest)
        run: pytest
      - name: Build Docker Image
        run: docker build -t taskora-backend:${{ github.sha }} .
      - name: Remove old container
        run: docker rm -f taskora || true
      
      - name: Run Container Test
        run: docker run -d -p 8000:8000 --name taskora taskora-backend:${{ github.sha }}
      - name: Wait for app
        run: |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health/)
            if [ $STATUS -eq 200 ]; then
              echo "App is healthy!"
              exit 0
            fi
            echo "Waiting..."
            sleep 3
          done
          echo "App did not become healthy"
          exit 1
      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Tag Image
        run: docker tag taskora-backend:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/taskora-backend:${{ github.sha }}

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/taskora-backend:${{ github.sha }}
      - name: Cleanup container
        if: always()
        run: docker rm -f taskora || true
  frontend:
    name: Frontend (React Build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: taskfront

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taskfront/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
    

  deploy:
    name: Deploy (Backend + Frontend + Health + Rollback)
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # 🚀 Backend Deploy
      - name: Deploy Backend (Render)
        run: curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}

      # ⏳wait for backend to be up
      - name: Wait for backend
        run:  |
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://taskora-rzc2.onrender.com/health/)
            if [ $STATUS -eq 200 ]; then
              echo "Backend is ready!"
              exit 0
            fi
            echo "Waiting..."
            sleep 10
          done
          
          echo "Backend did not become ready"
          exit 1

      # ❤️ Health Check
      - name: Health Check
        id: healthcheck
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://taskora-rzc2.onrender.com/health/)
          echo "Status: $STATUS"
          if [ $STATUS -ne 200 ]; then
            echo "Backend is unhealthy!"
            exit 1
          fi

      # 🚀 Frontend Setup
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          cd taskfront
          npm ci

      # ⚡ Vercel
      - name: Install Vercel CLI
        run: npm install -g vercel

      # 🌐 Deploy Frontend
      - name: Deploy Frontend (Vercel)
        run: |
          cd taskfront
          vercel --prod --confirm --token=${{ secrets.VERCEL_TOKEN }}

      # 🚑  if fail Rollback
      - name: Rollback Backend
        if: steps.healthcheck.outcome == 'failure'
        run: |
          echo "🚨 Rolling back backend..."
          curl -X POST ${{ secrets.RENDER_ROLLBACK_HOOK }}